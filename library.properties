sentence=Mesure du courant alternatif (AC) avec les capteurs ACS712, SCT-013 et similaires : crête, RMS, puissance apparente et estimation de puissance active.
paragraph=Permet de mesurer l'intensité crête, l'intensité efficace (RMS) et la puissance apparente, ainsi qu'une estimation de puissance active/réactive basée sur un facteur de puissance fourni. Fournit une calibration automatique du zéro et un filtrage logiciel. Compatible avec les capteurs analogiques centrés sur Vcc/2.
